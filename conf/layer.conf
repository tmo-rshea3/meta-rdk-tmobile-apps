# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rdk-tmobile-apps"
BBFILE_PATTERN_meta-rdk-tmobile-apps = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rdk-tmobile-apps = "99"

LAYERDEPENDS_meta-rdk-tmobile-apps = "core"
LAYERSERIES_COMPAT_meta-rdk-tmobile-apps = "dunfell kirkstone"

DISTRO_FEATURES_remove = "dac"
